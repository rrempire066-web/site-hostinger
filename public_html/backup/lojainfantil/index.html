<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CenterDrop Kids — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #FBF8F4;
    color: #251E18;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  header { display: flex; justify-content: center; padding: 28px 24px; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 21px; }
  .logo:hover { opacity: 0.75; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .box { max-width: 460px; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #B5502E; margin: 0 0 18px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin: 0 0 16px; line-height: 1.25; }
  p { font-size: 15px; line-height: 1.6; color: #5E534A; margin: 0 0 32px; }
  .btn { display: inline-block; background: #251E18; color: #FBF8F4; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; padding: 13px 28px; border-radius: 2px; }
  .btn:hover { opacity: 0.85; }
  footer { text-align: center; padding: 24px; font-size: 12px; color: #8A8074; }
  @media (max-width: 480px) {
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">
    <svg width="24" height="30" viewBox="0 0 48 56">
      <path d="M17.66 33.59 A15 15 0 1 1 30.34 33.59" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17.66 33.59 L30.34 33.59 C30.34 39 27 45 24 50 C21 45 17.66 39 17.66 33.59 Z" fill="currentColor"/>
    </svg>
    CenterDrop
  </a>
</header>

<main>
  <div class="box">
    <p class="eyebrow">Loja Infantil</p>
    <h1>Estamos em manutenção</h1>
    <p>Logo em breve estaremos de volta. Enquanto isso, continue explorando as outras lojas da CenterDrop.</p>
    <a class="btn" href="/">Voltar para o hub</a>
  </div>
</main>

<footer>© 2026 CenterDrop.</footer>

</body>
</html>
